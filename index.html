<!DOCTYPE html>
<html>
<head>

    <title>Traffic Control Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@500;600;700&display=swap"
          rel="stylesheet">

    <style>

        body {
            margin: 0;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #111827;
            color: white;

            font-family: 'Inter', sans-serif;
        }

        .login-box {
            width: 350px;
            padding: 35px;

            background: #1f2937;
            border-radius: 15px;

            box-shadow: 0 10px 30px rgba(0,0,0,0.4);

            text-align: center;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            margin-bottom: 30px;
        }

        input {
            width: 90%;
            padding: 14px;
            margin: 8px 0;

            border: none;
            border-radius: 8px;

            background: #374151;
            color: white;

            font-size: 16px;
        }

        button {
            width: 95%;
            padding: 14px;

            margin-top: 15px;

            border: none;
            border-radius: 8px;

            background: #2563eb;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #3b82f6;
        }

        .google-button {
            background: white;
            color: #222;
        }

        .google-button:hover {
            background: #eeeeee;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }

        .divider {
            margin: 20px 0;
            color: #9ca3af;
        }

    </style>

</head>

<body>

<div class="login-box">

    <h1>LOGIN</h1>

    <input
        type="text"
        id="username"
        placeholder="Username"
    >

    <input
        type="password"
        id="password"
        placeholder="Password"
    >

    <button onclick="login()">
        LOGIN
    </button>

    <div class="divider">
        ───── OR ─────
    </div>

    <button
        class="google-button"
        onclick="googleLogin()">

        Sign in with Google

    </button>

    <p id="message"></p>

</div>


<script type="module">

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

    import {
        getAuth,
        GoogleAuthProvider,
        signInWithPopup
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";


    /* =================================
       YOUR FIREBASE CONFIG
       ================================= */

    const firebaseConfig = {

        apiKey: "AIzaSyBG2HaxA2LGT7daRDufYZcgzzKCrGlbvu0",

        authDomain: "login-feature-for-traffic.firebaseapp.com",

        projectId: "login-feature-for-traffic",

        storageBucket: "login-feature-for-traffic.firebasestorage.app",

        messagingSenderId:
            "658448480986",

        appId:
            "1:658448480986:web:314b9c4585486d597e83e3"   

    };


    /* =================================
       FIREBASE
       ================================= */

    const app =
        initializeApp(firebaseConfig);

    const auth =
        getAuth(app);

    const provider =
        new GoogleAuthProvider();


    /* =================================
       NORMAL LOGIN
       ================================= */

    window.login = function() {

        const username =
            document.getElementById("username").value;

        const password =
            document.getElementById("password").value;


        const correctUsername = "Admin";

        const correctPassword = "TrafficDemo-7392";


        if (
            username === correctUsername &&
            password === correctPassword
        ) {

            document.getElementById("message").innerHTML =
                "Login successful!";

            document.getElementById("message").style.color =
                "#22c55e";


            setTimeout(function() {

                window.location.href =
                    "dashboard.html";

            }, 800);

        }

        else {

            document.getElementById("message").innerHTML =
                "Incorrect username or password";

            document.getElementById("message").style.color =
                "#ef4444";

        }

    };


    /* =================================
       GOOGLE LOGIN
       ================================= */

    window.googleLogin = async function() {

        try {

            const result =
                await signInWithPopup(
                    auth,
                    provider
                );


            const user =
                result.user;


            document.getElementById("message").innerHTML =
                "Welcome, " + user.displayName + "!";

            document.getElementById("message").style.color =
                "#22c55e";


            setTimeout(function() {

                window.location.href =
                    "dashboard.html";

            }, 800);


        }

        catch (error) {

            console.error(error);

            document.getElementById("message").innerHTML =
                "Google login failed.";

            document.getElementById("message").style.color =
                "#ef4444";

        }

    };

</script>

</body>
</html>
