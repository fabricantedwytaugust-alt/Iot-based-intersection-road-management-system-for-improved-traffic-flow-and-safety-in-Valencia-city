<!DOCTYPE html>
<html>
<head>
    <title>Traffic Control</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>
        body {
            margin: 0;
            background: #111827;
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            background: #1f2937;
            padding: 20px;
            text-align: center;
        }

        h1 {
            margin: 0;
        }

        .dashboard {
            width: 90%;
            max-width: 1100px;
            margin: 25px auto;
        }

        .card {
            background: #1f2937;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 15px;
        }

        #map {
            width: 100%;
            height: 450px;
            border-radius: 12px;
        }

        .coordinates {
            text-align: center;
            margin-top: 10px;
            color: #d1d5db;
        }

        .buzzer {
            text-align: center;
        }

        #buzzerButton {
            background: #dc2626;
            color: white;
            border: none;
            padding: 18px 35px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        #status {
            margin-top: 15px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <h1>TRAFFIC CONTROL SYSTEM</h1>
</header>

<div class="dashboard">

    <div class="card">

        <h2>📍 System Location</h2>

        <div id="map"></div>

        <div class="coordinates">
            7.911194425734629, 125.09309316775534
        </div>

    </div>

    <div class="card buzzer">

        <h2>🚨 Emergency Buzzer</h2>

        <button id="buzzerButton" onclick="toggleBuzzer()">
            🔔 TURN BUZZER ON
        </button>

        <div id="status">
            Buzzer:
            <span id="buzzerState" style="color:red;">
                OFF
            </span>
        </div>

    </div>

</div>

<!-- LOAD LEAFLET -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

    // =========================
    // MAP
    // =========================

    const latitude = 7.911194425734629;
    const longitude = 125.09309316775534;

    const map = L.map("map").setView(
        [latitude, longitude],
        17
    );

    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            attribution: "&copy; OpenStreetMap contributors"
        }
    ).addTo(map);

    const marker = L.marker(
        [latitude, longitude]
    ).addTo(map);

    marker.bindPopup(
        "<b>🚦 Traffic Management System</b><br>System Location"
    );

    // =========================
    // BUZZER
    // =========================

    let buzzerOn = false;

    function toggleBuzzer() {

        buzzerOn = !buzzerOn;

        const button =
            document.getElementById("buzzerButton");

        const state =
            document.getElementById("buzzerState");

        if (buzzerOn) {

            button.innerHTML =
                "🔕 TURN BUZZER OFF";

            state.innerHTML =
                "ON";

            state.style.color =
                "#32CD32";

        } else {

            button.innerHTML =
                "🔔 TURN BUZZER ON";

            state.innerHTML =
                "OFF";

            state.style.color =
                "red";
        }
    }

</script>

</body>
</html>
