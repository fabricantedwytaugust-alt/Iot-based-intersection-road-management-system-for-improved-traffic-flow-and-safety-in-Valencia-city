<!DOCTYPE html>
<html>
<head>
    <title>Traffic Control Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@500;600;700&display=swap" rel="stylesheet">

    <style>

        body {
            margin: 0;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #111827;
            color: white;

            font-family: 'Inter', sans-serif;
        }

        .login-box {
            width: 350px;
            padding: 35px;

            background: #1f2937;
            border-radius: 15px;

            box-shadow: 0 10px 30px rgba(0,0,0,0.4);

            text-align: center;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            margin-bottom: 30px;
        }

        input {
            width: 90%;
            padding: 14px;
            margin: 8px 0;

            border: none;
            border-radius: 8px;

            background: #374151;
            color: white;

            font-size: 16px;
        }

        input:focus {
            outline: 2px solid #3b82f6;
        }

        button {
            width: 95%;
            padding: 14px;

            margin-top: 20px;

            border: none;
            border-radius: 8px;

            background: #2563eb;
            color: white;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #3b82f6;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }

    </style>
</head>

<body>

    <div class="login-box">

        <h1>🚦 LOGIN</h1>

        <input
            type="text"
            id="username"
            placeholder="Username"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
        >

        <button onclick="login()">
            LOGIN
        </button>

        <p id="message"></p>

    </div>


    <script>

        function login() {

            const username =
                document.getElementById("username").value;

            const password =
                document.getElementById("password").value;


            // CHANGE THESE
            const correctUsername = "Admin";
            const correctPassword = "1234";


            if (
                username === correctUsername &&
                password === correctPassword
            ) {

                document.getElementById("message").innerHTML =
                    "Login successful";

                document.getElementById("message").style.color =
                    "#22c55e";

                // Go to dashboard
                setTimeout(function() {

                    window.location.href = "index.html";

                }, 800);

            } else {

                document.getElementById("message").innerHTML =
                    "Incorrect username or password";

                document.getElementById("message").style.color =
                    "#ef4444";

            }

        }

    </script>

</body>
</html>
